# Editorial-ledger theme — financial print: paper, ink, ledger green.
# Typography (Fraunces / IBM Plex Mono) is layered on via CSS in streamlit_app.py.
[theme]
base = "light"
primaryColor = "#0E5A43"
backgroundColor = "#F7F2E9"
secondaryBackgroundColor = "#EFE7D6"
textColor = "#1C1B17"
font = "serif"

[browser]
gatherUsageStats = false

[server]
# The file watcher walks every imported module, including hundreds of lazy
# transformers vision models whose torchvision import fails — flooding the logs
# with tracebacks and slowing startup. Restart `make ui` to pick up code changes.
fileWatcherType = "none"
